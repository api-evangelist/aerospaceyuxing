source: https://www.emposat.com/service/manageSupport
scope: >-
  Aerospace Yuxing publishes no API contract, so there are no web-API standards to assert from a
  spec. What it does publish, on its own service pages, is the set of space ground-segment
  interface protocols over which it will accept a center-to-center connection from a satellite
  operator. Those are the real machine interfaces this company offers, and they are recorded here
  as provider-claimed rather than verified, because no contract, schema or endpoint is published
  that would let anyone check them. The web-API standards block below is recorded as
  not-applicable rather than false, so this file is never mistaken for a compliance posture the
  company does not claim.
domain_standards:
