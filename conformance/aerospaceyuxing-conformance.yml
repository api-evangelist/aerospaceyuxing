  name: PDXP (Payload Data Exchange Protocol) - spacecraft TT&C / payload data exchange
  conforms: true
  verified: false
  evidence: >-
    https://www.emposat.com/service/manageSupport states, of its long-term spacecraft operations
    management service: "中心对中心的连接...支持PDXP、CSP、KISS、CORTEX、AX.25等协议，也可适配用户自定义接口协议"
    ("center-to-center connection ... supports PDXP, CSP, KISS, CORTEX, AX.25 and other protocols,
    and can also adapt to user-defined interface protocols").
  note: provider claim on its own service page; no protocol profile, ICD or schema is published
