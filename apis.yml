aid: aerospaceyuxing
name: Aerospace Yuxing
description: 'Aerospace Yuxing (Chinese: 航天驭星; English brand: Emposat Co., Ltd.; legally Beijing
  Aerospace Yuxing Technology Co., Ltd.) is a Beijing-headquartered commercial space-infrastructure
  operator founded in 2016 by a core team drawn from the China Academy of Space Technology and the
  wider China Aerospace Science and Technology Corporation system. It builds and operates the ground
  segment that commercial satellites depend on: a global network of more than 60 satellite ground
  stations across China, Kenya, South Africa, Malaysia, the Philippines, Thailand, the South Pacific
  and South America, plus the Ningxia Zhongwei remote-sensing calibration site. Its service catalog
  spans launch-vehicle and spacecraft telemetry, tracking and command (TT&C), long-term on-orbit
  operations management, payload data reception and processing, remote-sensing satellite calibration,
  space situational awareness and collision warning, debris mitigation, frequency coordination and
  launch licensing support, and aerospace engineering consulting. It also manufactures ground-system,
  communication and software-system products - multifunction baseband units, on-board transceivers
  and transponders, portable and integrated TT&C/data-reception ground stations, and TT&C operations
  software. The company has served over 370 satellites and rockets, employs roughly 300 people, and
  closed nearly CNY 2 billion across D, D+ and D++ rounds in 2026. Its customer-facing systems are
  delivered as installed software and a China-hosted service portal; center-to-center integration is
  offered over space ground-segment protocols (PDXP, CSP, KISS, CORTEX, AX.25) rather than a public
  web API. Aerospace Yuxing publishes no developer portal, no public API documentation, no SDK and
  no machine-readable API contract of any kind.'
